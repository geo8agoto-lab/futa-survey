<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>蓋調査マップ（端末版）</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="蓋調査">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="leaflet.css">
<script src="leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #map { position: absolute; inset: 0; }
  .bar { position: absolute; top: 10px; left: 50px; right: 10px; z-index: 1000; display: flex; gap: 6px; }
  .bar input { flex: 1; min-width: 0; padding: 10px; font-size: 16px; border: 1px solid #999; border-radius: 6px; }
  .bar button { padding: 10px 12px; font-size: 15px; border: 0; border-radius: 6px; background: #1f4e78; color: #fff; }
  .legend { position: absolute; bottom: 20px; left: 10px; z-index: 1000; background: rgba(255,255,255,.92);
            padding: 8px 10px; border-radius: 6px; font-size: 13px; line-height: 1.7; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid #fff; }
  #msg { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 3000; background: #333; color: #fff;
         padding: 8px 14px; border-radius: 6px; font-size: 14px; display: none; max-width: 90%; }
  .pop b { font-size: 16px; }
  .pop .shoot { display: block; width: 100%; margin-top: 8px; padding: 12px; background: #2e7d32; color: #fff;
                border: 0; border-radius: 6px; font-size: 16px; }
  .pop .nav { display: block; margin-top: 6px; text-align: center; font-size: 13px; }
  table.ledger { border-collapse: collapse; margin-top: 6px; font-size: 13px; width: 100%; }
  table.ledger th { text-align: left; color: #666; font-weight: normal; padding: 2px 8px 2px 0; white-space: nowrap; vertical-align: top; }
  table.ledger td { padding: 2px 0; }
  .fixed { color: #b45309; font-weight: bold; }

  /* ---- 入力ウィザード ---- */
  #warn { position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; }
  #warn.open { display: flex; }
  .wbox { background: #fff; border-radius: 12px; padding: 20px; width: min(440px, 90vw); }
  .wbox button { padding: 14px; font-size: 16px; border: 0; border-radius: 8px; }
  .req { display: inline-block; font-size: 11px; color: #fff; background: #c62828; border-radius: 3px; padding: 1px 5px; vertical-align: 2px; }
  .opt { display: inline-block; font-size: 11px; color: #555; background: #e0e0e0; border-radius: 3px; padding: 1px 5px; vertical-align: 2px; }
  .info3 { background: #f3f6fa; border: 1px solid #d5dfeb; border-radius: 8px; padding: 8px 12px; font-size: 15px; line-height: 1.7; margin-bottom: 4px; }
  .info3 b { display: inline-block; width: 6em; color: #555; font-weight: normal; }
  .fld .hint { font-size: 12px; color: #666; margin-top: 3px; }
  .fld.miss select { border-color: #c62828; background: #fff5f5; }
  .fld .other { margin-top: 6px; display: none; }
  .selrow { display: flex; gap: 6px; align-items: stretch; }
  .selrow select { flex: 1; min-width: 0; }
  .nochg { flex: 0 0 auto; width: 6.8em; padding: 0 4px; border: 1.5px solid #1e963c; color: #1e963c; background: #fff;
           border-radius: 8px; font-size: 13px; font-weight: bold; white-space: nowrap; }
  .nochg.on { background: #1e963c; color: #fff; }
  .fld.hardng select { border: 2px solid #c62828; background: #fff5f5; }
  .fld.hardng .hint { color: #c62828; font-weight: bold; }
  .nochg:disabled { opacity: .3; }
  details.more { margin-top: 16px; border-top: 1px solid #eee; padding-top: 8px; }
  details.more summary { color: #1f4e78; font-size: 15px; cursor: pointer; }
  .confirm td.ng { color: #c62828; font-weight: bold; }
  .pop .move { display: block; width: 100%; margin-top: 6px; padding: 8px; background: #fff; color: #6a1b9a;
               border: 1px solid #ba68c8; border-radius: 6px; font-size: 14px; }
  .pop .reset { display: block; width: 100%; margin-top: 6px; padding: 8px; background: #fff; color: #b71c1c;
                border: 1px solid #e57373; border-radius: 6px; font-size: 14px; }
  .pop .attr { display: block; width: 100%; margin-top: 6px; padding: 10px; background: #fff; color: #1f4e78;
               border: 1px solid #1f4e78; border-radius: 6px; font-size: 15px; }
  #login { position: fixed; inset: 0; z-index: 5000; background: #eef3f8; display: none; align-items: center; justify-content: center; }
  #login.open { display: flex; }
  .lbox { background: #fff; padding: 24px; border-radius: 14px; width: min(360px, 88vw); box-shadow: 0 4px 20px rgba(0,0,0,.15); }
  #lgBtn { width: 100%; margin-top: 8px; padding: 14px; font-size: 18px; border: 0; border-radius: 8px; background: #1f4e78; color: #fff; }
  .who { font-size: 12px; color: #555; margin-top: 4px; }
  .who a { color: #1f4e78; margin-left: 6px; }
  #newBanner { display: none; position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 1500;
               background: #1565c0; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #moveBanner { display: none; position: fixed; top: 70px; left: 12px; z-index: 2500; background: #6a1b9a; color: #fff;
                padding: 10px 14px; border-radius: 8px; font-size: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #moveBanner button { margin-left: 8px; padding: 6px 10px; border: 0; border-radius: 6px; }
  body.movemode #map { cursor: crosshair; }
  #fPos.chg .posinfo { color: #6a1b9a; font-weight: bold; }
  #newBanner button { margin-left: 8px; padding: 6px 10px; border: 0; border-radius: 6px; }
  body.newmode #map { cursor: crosshair; }
  #list { position: fixed; left: 0; right: 0; bottom: 0; height: 60vh; z-index: 1800; background: #fff; display: none;
          flex-direction: column; border-radius: 14px 14px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.25); }
  #list.open { display: flex; }
  .lhead { padding: 10px 14px; border-bottom: 1px solid #ddd; }
  .lctl { display: flex; gap: 6px; margin-top: 8px; }
  .lctl input { flex: 1; min-width: 0; } .lctl select { width: auto; }
  .lclose { border: 0; background: #eee; border-radius: 6px; font-size: 20px; width: 40px; height: 36px; }
  #litems { flex: 1; overflow-y: auto; }
  .li { padding: 10px 14px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
  .li:active { background: #e3f2fd; }
  .li .t1 { font-weight: bold; } .li .t2 { font-size: 13px; color: #666; }
  .li .dist { margin-left: auto; font-size: 13px; color: #1f4e78; white-space: nowrap; }
  /* 入力枠：縦向きは画面下 約1/3〜、横向きは画面右 約1/3（地図は常に見える） */
  #panel { position: fixed; left: 0; right: 0; bottom: 0; height: 60vh; z-index: 2000; background: #fff; display: none;
           flex-direction: column; border-radius: 14px 14px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,.25); }
  #panel.open { display: flex; }
  .head { padding: 12px 14px 8px; border-bottom: 1px solid #ddd; }
  .head h2 { margin: 0; font-size: 19px; }
  .head .sub { color: #555; font-size: 13px; }
  .steps { display: flex; gap: 4px; margin-top: 8px; }
  .steps div { flex: 1; text-align: center; font-size: 12px; padding: 5px 0; border-radius: 4px; background: #e8e8e8; color: #777; }
  .steps div.on { background: #1f4e78; color: #fff; font-weight: bold; }
  .steps div.ok { background: #c8e6c9; color: #1b5e20; }
  .body { flex: 1; overflow-y: auto; padding: 14px; }
  .step { display: none; }
  .step.on { display: block; }
  .step h3 { margin: 0 0 6px; font-size: 18px; }
  .hint { color: #555; font-size: 14px; margin-bottom: 12px; }
  .cam { display: block; text-align: center; padding: 18px; background: #1f4e78; color: #fff; border-radius: 10px; font-size: 19px; }
  /* 撮影ボタン：透明な入力部品をボタンの上に重ね、指で直接押させる（iPhone・iPad・アプリ内ブラウザ対策） */
  .cam, .gal { position: relative; overflow: hidden; }
  .cam input, .gal input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0;
                           font-size: 200px; cursor: pointer; z-index: 2; }
  .gal { display: block; text-align: center; margin-top: 12px; font-size: 14px; color: #1f4e78; text-decoration: underline; }
  .prev { height: 22vh; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; margin: 10px auto 0; display: none; background: #eee; max-width: 100%; }
  .shots2 { display: flex; gap: 8px; margin-top: 10px; }
  .shots2 figure { flex: 1; margin: 0; text-align: center; font-size: 12px; color: #555; }
  .shots2 img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; background: #eee; }
  .okbtn { display: none; width: 100%; margin-top: 12px; padding: 16px; font-size: 19px; border: 0; border-radius: 10px; background: #2e7d32; color: #fff; }
  .skip { display: block; text-align: center; margin-top: 22px; font-size: 14px; color: #8a4b00; text-decoration: underline; }
  label.t { display: block; font-weight: bold; margin: 14px 0 6px; }
  select, input[type=text], input[type=number], input[type=password], textarea { width: 100%; box-sizing: border-box; padding: 11px; font-size: 16px;
           border: 1px solid #999; border-radius: 6px; background: #fff; }
  .sec { margin-top: 18px; padding: 10px 12px 12px; border: 1px solid #d5dfeb; border-radius: 8px; background: #f7f9fc; }
  .sec .cap { font-weight: bold; color: #1f4e78; }
  .sec .cap small { font-weight: normal; color: #666; }
  .fld { margin-top: 10px; }
  .fld .lbl { display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; margin-bottom: 4px; }
  .fld .orig { font-weight: normal; color: #777; font-size: 12px; }
  .fld.chg select, .fld.chg input { background: #fff3cd; border-color: #e0a800; }
  .fld .undo { font-size: 12px; color: #1f4e78; text-decoration: underline; margin-left: 6px; display: none; }
  .fld.chg .undo { display: inline; }
  .posbtn { width: 100%; padding: 11px; font-size: 15px; border: 1px solid #1f4e78; color: #1f4e78; background: #fff; border-radius: 6px; }
  .posinfo { font-size: 13px; color: #555; margin-top: 6px; }
  .auto { margin-top: 12px; padding: 10px; border-radius: 6px; background: #fff; border: 1px dashed #b0bec5; font-size: 14px; }
  .auto b { color: #1f4e78; }
  .confirm .imgs { display: flex; gap: 8px; }
  .confirm .imgs figure { flex: 1; margin: 0; text-align: center; font-size: 12px; color: #555; }
  .confirm .imgs img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; background: #eee; }
  .confirm table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 15px; }
  .confirm th { text-align: left; width: 34%; color: #555; font-weight: normal; padding: 8px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
  .confirm td { padding: 8px 4px; border-bottom: 1px solid #eee; }
  .foot { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #ddd; background: #fff; }
  .foot button { flex: 1; padding: 15px; font-size: 17px; border: 0; border-radius: 8px; }
  #bBack { background: #eee; flex: 0 0 24%; }
  #bTemp { background: #fff3cd; color: #8a5a00; flex: 0 0 28%; font-size: 15px; }
  #bNext { background: #2e7d32; color: #fff; }
  #bNext:disabled { background: #9e9e9e; }

  /* ---- iPad mini などタブレット（幅700px以上） ---- */
  @media (min-width: 700px) {
    .bar { left: 60px; right: 16px; top: 14px; max-width: 640px; }
    .bar input, .bar button { font-size: 17px; padding: 12px 16px; }
    .legend { font-size: 15px; padding: 10px 14px; }
    .dot { width: 13px; height: 13px; }
    .leaflet-popup-content { min-width: 280px; font-size: 15px; }
    table.ledger { font-size: 14px; }
    #panel { height: 40vh; }                                   /* 縦向き：下 約1/3 */
    .head { padding: 10px 20px 8px; }
    .head h2 { font-size: 20px; display: inline; }
    .head .sub { font-size: 14px; display: inline; margin-left: 10px; }
    .steps div { font-size: 14px; padding: 6px 0; }
    .body { padding: 12px 20px; }
    .step h3 { font-size: 18px; }
    .fld .lbl { font-size: 15px; } .fld .orig { font-size: 13px; }
    select, input[type=text], input[type=number], input[type=password], textarea { font-size: 17px; padding: 11px; }
    label.t { font-size: 16px; } .auto { font-size: 15px; } .posbtn { font-size: 16px; padding: 12px; }
    #svForm { display: grid; grid-template-columns: 1fr 1fr; column-gap: 14px; }
    .confirm .imgs img { max-height: 16vh; }
    .foot { padding: 10px 20px; }
    .foot button { font-size: 18px; padding: 14px; }
    #bBack { flex: 0 0 22%; } #bTemp { flex: 0 0 26%; }
  }
  /* 横向き：右 約1/3 */
  @media (min-width: 700px) { #list { height: 40vh; } }
  @media (orientation: landscape) and (min-width: 700px) {
    #list { top: 0; right: auto; height: auto; width: 34vw; min-width: 380px; border-radius: 0; box-shadow: 4px 0 16px rgba(0,0,0,.25); }
    #panel { top: 0; left: auto; height: auto; width: 34vw; min-width: 380px; border-radius: 0; box-shadow: -4px 0 16px rgba(0,0,0,.25); }
    .head h2, .head .sub { display: block; margin-left: 0; }
    #svForm { grid-template-columns: 1fr; }
    .prev { height: 30vh; }
    .confirm .imgs img { max-height: none; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <input id="q" placeholder="人孔番号 または mslink" enterkeyhint="search">
  <button onclick="search()">検索</button>
  <button onclick="openList()">リスト</button>
  <button id="bNew" onclick="startNew()" style="background:#1565c0">＋新規</button>
  <button onclick="locate()">現在地</button>
  <button onclick="load()">更新</button>
</div>
<div class="legend" id="legend"></div>
<div id="msg"></div>
<div id="login">
  <form class="lbox" onsubmit="doLogin();return false;">
    <div style="font-size:20px;font-weight:bold;margin-bottom:4px">マンホール蓋調査</div>
    <div style="color:#666;font-size:14px;margin-bottom:14px">ユーザーIDとパスワードでログインしてください</div>
    <label class="t">ユーザーID</label>
    <input type="text" id="lgId" autocomplete="username" autocapitalize="off" autocorrect="off">
    <label class="t">パスワード</label>
    <input type="password" id="lgPw" autocomplete="current-password">
    <div id="lgMsg" style="color:#c62828;font-size:14px;min-height:20px;margin-top:8px"></div>
    <button type="submit" id="lgBtn">ログイン</button>
  </form>
</div>
<div id="moveBanner">🗺 移動先の位置を地図でタップしてください　<button onclick="cancelMove()">やめる</button></div>
<div id="newBanner">📍 新規登録：地図上のマンホールの位置をタップしてください　<button onclick="cancelNew()">やめる</button></div>

<div id="list">
  <div class="lhead">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b style="font-size:18px">人孔リスト</b><button class="lclose" onclick="closeList()">×</button>
    </div>
    <div class="lctl">
      <input id="lq" placeholder="人孔番号・mslinkで絞り込み" oninput="renderList()">
      <select id="lst" onchange="renderList()">
        <option value="未調査">未調査</option><option value="一時保存">一時保存</option>
        <option value="済">調査済み</option><option value="新規">新規登録</option><option value="">すべて</option>
      </select>
      <select id="lsort" onchange="sortChange()">
        <option value="near">近い順</option><option value="ban">人孔番号順</option>
      </select>
    </div>
    <div id="lcount" style="font-size:13px;color:#666;margin-top:4px"></div>
  </div>
  <div id="litems"></div>
</div>

<div id="panel">
  <div class="head">
    <h2 id="pBan"></h2>
    <div class="sub" id="pSub"></div>
    <div class="steps" id="steps">
      <div>① 蓋アップ</div><div>② 全景</div><div>③ 調査項目</div><div>④ 確認</div>
    </div>
  </div>

  <div class="body">
    <!-- ① 蓋アップ -->
    <div class="step" id="st0">
      <h3>① 蓋のアップ</h3>
      <div class="hint">蓋の<b>真上</b>から、蓋全体が画面いっぱいに入るように撮影</div>
      <label class="cam">📷 <span>蓋アップを撮影する</span><input type="file" accept="image/*" capture="environment" onclick="saveDraft()" onchange="pick(this,'futa')"></label>
      <label class="gal">アルバムから選ぶ<input type="file" accept="image/*" onclick="saveDraft()" onchange="pick(this,'futa')"></label>
      <img class="prev" id="iFuta">
      <a class="skip" href="#" onclick="skipPhotos();return false;">撮影できない（駐車車両・蓋が見当たらない など）</a>
    </div>

    <!-- ② 全景 -->
    <div class="step" id="st1">
      <h3>② 全景</h3>
      <div class="hint">スマホ・iPadを<b>横向き</b>にして、周囲が分かる位置から蓋を入れて撮影</div>
      <label class="cam">📷 <span>全景を撮影する</span><input type="file" accept="image/*" capture="environment" onclick="saveDraft()" onchange="pick(this,'fukei')"></label>
      <label class="gal">アルバムから選ぶ<input type="file" accept="image/*" onclick="saveDraft()" onchange="pick(this,'fukei')"></label>
      <div class="shots2">
        <figure><img id="tFuta"><figcaption>蓋アップ</figcaption></figure>
        <figure><img id="iFukei"><figcaption>全景</figcaption></figure>
      </div>
      <button type="button" class="okbtn" id="okPhotos" onclick="go(2)">OK（調査項目へ）</button>
    </div>

    <!-- ③ 調査項目 -->
    <div class="step" id="st2">
      <h3>③ 調査項目</h3>
      <div class="info3" id="info3"></div>
      <div class="fld"><div class="lbl"><span>調査者 <span class="req">必須</span></span></div>
        <select id="pChosain" onchange="workerChange()"></select></div>
      <div id="svForm"></div>
      <div class="fld" id="fPos">
        <div class="lbl"><span>位置</span><span class="orig" id="posOrig"></span></div>
        <div style="display:flex;gap:6px">
          <button type="button" class="posbtn" onclick="startMove()">🗺 地図をタップして移動</button>
          <button type="button" class="posbtn" onclick="moveToGps()">📍 今いる場所へ</button>
        </div>
        <div class="posinfo" id="posInfo"></div>
        <a href="#" class="undo" onclick="undoMove();return false;">元の位置に戻す</a>
      </div>
      <div class="auto" id="autoBox"></div>
      <details class="more">
        <summary>調査状況・メモ（撮影できないときなど）</summary>
        <label class="t">調査状況</label>
        <select id="pStatus" onchange="svChange()">
          <option value="">未調査のまま（内業で項目・位置だけ入力）</option>
          <option>撮影完了</option>
          <option>要再調査（撮影あり）</option>
          <option>確認不可（駐車車両等）</option>
          <option>蓋が見当たらない</option>
        </select>
        <label class="t">調査メモ</label>
        <textarea id="pMemo" rows="2" oninput="saveDraft()"></textarea>
      </details>
    </div>

    <!-- ④ 確認 -->
    <div class="step confirm" id="st3">
      <h3>④ 内容の確認</h3>
      <div class="imgs">
        <figure><img id="cFuta"><figcaption>蓋アップ</figcaption></figure>
        <figure><img id="cFukei"><figcaption>全景</figcaption></figure>
      </div>
      <table id="cTable"></table>
    </div>
  </div>

  <div class="foot">
    <button id="bBack" onclick="back()">戻る</button>
    <button id="bTemp" onclick="tempSave()">一時保存</button>
    <button id="bNext" onclick="next()">次へ</button>
  </div>
</div>

<div id="warn">
  <div class="wbox">
    <div style="font-size:18px;font-weight:bold;color:#b45309;margin-bottom:8px">⚠ 必須項目の確認</div>
    <div id="warnText" style="font-size:16px;line-height:1.7"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button type="button" onclick="warnClose()" style="flex:1;background:#eee">戻って入力する</button>
      <button type="button" onclick="warnOk()" style="flex:1;background:#2e7d32;color:#fff">そのまま登録</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="device.js"></script>
<script>
const VERSION = '端末版 v19';
const PHOTO_MAX = 1280;   // 写真の長辺(px)。小さいほど送信が速い
const PHOTO_Q = 0.8;     // JPEG画質
const COLORS = [

function draw() {
  layer.clearLayers(); markers = {};

  DATA.pts.forEach(p => {
    const col = (p[5] === '新規' && p[4] !== '一時保存') ? '#1565c0' : colorOf(p[4]);

    m.on('click', () => { if (moveMode || newMode) return; m.bindPopup(popupHtml(p)).openPopup(); });   // 位置指定中は吹き出しを出さない
    m.addTo(layer);
    markers[p[0]] = { m, p };

    counts[name] = (counts[name] || 0) + 1;
  });
  $('legend').innerHTML = COLORS.map(c =>
    '<div><span class="dot" style="background:' + c[1] + '"></span>' + c[0] + '　' + (counts[c[0]] || 0) + '</div>').join('') +
    '<div style="font-size:11px;color:#888">撮影対応版 ' + VERSION + '</div>' +

// ---------- ログイン ----------
let TOKEN = store0('futaToken');
function store0(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function showLogin(m) {
  $('login').classList.add('open'); $('lgMsg').textContent = m || '';
  try { $('lgId').value = localStorage.getItem('futaUser') || ''; } catch (e) {}
  setTimeout(() => ($('lgId').value ? $('lgPw') : $('lgId')).focus(), 100);
}
function needLogin(e) { return e && String(e.message || e).indexOf('LOGIN_REQUIRED') >= 0; }
function doLogin() {
  const id = $('lgId').value.trim(), pw = $('lgPw').value;
  $('lgBtn').disabled = true; $('lgBtn').textContent = 'ログイン中…';
  google.script.run
    .withSuccessHandler(r => {
      TOKEN = r.token;
      try { localStorage.setItem('futaToken', r.token); localStorage.setItem('futaUser', id);
            if (!localStorage.getItem('chosain')) localStorage.setItem('chosain', r.name); } catch (e) {}
      $('lgPw').value = ''; $('lgBtn').disabled = false; $('lgBtn').textContent = 'ログイン';
      $('login').classList.remove('open');
      load();
    })
    .withFailureHandler(e => {
      $('lgBtn').disabled = false; $('lgBtn').textContent = 'ログイン';
      $('lgMsg').textContent = e.message;
    })
    .login(id, pw);
}
function doLogout() {
  if (!confirm('ログアウトしますか？')) return;
  google.script.run.logout(TOKEN);
  TOKEN = ''; try { localStorage.removeItem('futaToken'); } catch (e) {}
  showLogin('ログアウトしました');
}

function load() {
  if (!TOKEN) { showLogin(); return; }
  msg('読み込み中…');
  google.script.run
    .withSuccessHandler(s => {
      const first = !DATA;
      DATA = JSON.parse(s);
      DATA.pts.forEach(p => { p[0] = String(p[0]); if (!p[P_FIX]) p[P_FIX] = {}; });
      DATA.pts.forEach(p => { if (!p[13]) p[13] = {}; });
      SV = DATA.survey || [];
      draw();
      msg('最新の状況を表示しました', 1500);
      if (first) {
        const v = savedView();
        if (v) map.setView([v.lat, v.lng], v.z, { animate: false });
        else if (DATA.pts.length) map.fitBounds(L.latLngBounds(DATA.pts.map(p => [p[2], p[3]])));
        urlParam(prm => {
          if (prm.ms) jumpTo(String(prm.ms));      // スプレッドシートから開いたときはその人孔へ
          else restoreDraft();                     // 入力途中があれば再開
        });
      }
    })
    .withFailureHandler(e => {
      if (needLogin(e)) { TOKEN = ''; msg('', 1); showLogin('ログインの有効期限が切れました。もう一度ログインしてください'); return; }
      msg('読み込みエラー：' + e.message);
    })
    .getMapData(TOKEN);
}

function search() {
  const q = $('q').value.trim().toUpperCase();
  if (!q || !DATA) return;
  const ban = p => String(banOf(p)).toUpperCase();
  const hit = DATA.pts.find(p => p[0] === q || ban(p) === q || p[1].toUpperCase() === q) ||
              DATA.pts.find(p => ban(p).indexOf(q) >= 0);
  if (!hit) { msg('見つかりません', 1500); return; }
  jumpTo(hit[0]);
}
// 指定の人孔へ移動（縮尺は今のまま。広域表示中だけ拡大）
function jumpTo(ms) {
  const mk = markers[ms];
  if (!mk) { msg('mslink ' + ms + ' が見つかりません', 2000); return; }
  map.setView([curLat(mk.p), curLon(mk.p)], Math.max(map.getZoom(), 18));
  mk.m.bindPopup(popupHtml(mk.p)).openPopup();
}
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

    () => msg('現在地を取得できませんでした（位置情報の許可を確認）', 2500),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

// 台帳の入力欄を作る（初期値＝現在値、比較は元の台帳値）

let TODAY = (() => { const d = new Date(); return d.getFullYear() + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + ('0' + d.getDate()).slice(-2); })();
function buildSvForm() {

// 台帳のコード（プルダウンにあるものだけ）
function ledgerCode(f) {
  if (!cur || isNewPt()) return '';
  const c = String(origOf(cur, f.key) || '').trim();
  return f.opts.some(o => o[0] === c) ? c : '';
}
// 未入力の項目に台帳の値（コード：名称）を入れておく
function prefillLedger() {
  SV.forEach(f => { const el = $('S_' + f.key); const c = ledgerCode(f); if (el && !el.value && c) el.value = c; });
}
// 「変更なし」＝台帳の値のまま
function noChange(key) {
  const f = SV.find(x => x.key === key), el = $('S_' + key), c = ledgerCode(f);
  if (!el || !c || el.disabled) return;
  el.value = c;
  if ($('O_' + key)) $('O_' + key).value = '';
  svChange();
}
// 出す・出さない（口径枝番は口径 02：300 のときだけ）
function shown(f) {
  if (!f.showIf) return true;
  return Object.keys(f.showIf).every(k => $('S_' + k) && $('S_' + k).value === f.showIf[k]);
}
// 空のままでは先へ進めない項目（口径枝番）
function hardMissing() {
  return SV.filter(f => f.hard && shown(f) && !($('S_' + f.key) || {}).value).map(f => f.name);
}
// 選択肢の連動（スリップ防止「あり」はDのみ／口径枝番は口径 02 のときだけ）
function applyRules() {
  const type = $('S_type') ? $('S_type').value : '';
  SV.forEach(f => {
    const el = $('S_' + f.key); if (!el) return;
    if (f.showIf) {
      const on = shown(f);
      $('F_' + f.key).style.display = on ? '' : 'none';
      if (!on) el.value = '';
      $('F_' + f.key).classList.toggle('hardng', on && f.hard && !el.value);
    }
    if (f.naIfType) {
      const na = !!type && f.naIfType.some(c => type.indexOf(c) === 0);
      if (na) { el.value = ''; el.disabled = true; el.options[0].text = '該当なし'; }
      else { el.disabled = false; el.options[0].text = '（未選択）'; }
    }
    if (f.onlyIfType) {
      [...el.options].forEach(o => {
        const need = f.onlyIfType[o.value];
        if (!need) return;
        const ok = !!type && need.some(c => type.indexOf(c) === 0);
        o.disabled = !ok;
        if (!ok && el.value === o.value) el.value = '';
      });
    }
    const ot = $('O_' + f.key);
    if (ot) ot.style.display = el.value === f.other ? 'block' : 'none';
    const nb = $('N_' + f.key);
    if (nb) {
      const c = ledgerCode(f);
      nb.disabled = !c || el.disabled;
      const on = !!c && !el.disabled && el.value === c;
      nb.classList.toggle('on', on);
      nb.textContent = on ? '✓ 変更なし' : '変更なし';
      nb.title = c ? '台帳：' + codeName(f.key, c) : '台帳にコードがありません';
    }
  });
}
// 値はコードで持つ。「その他」の記述は _other に
function svRead() {
  const v = { _other: {} };
  SV.forEach(f => {
    const el = $('S_' + f.key); if (!el) return;
    v[f.key] = el.disabled ? '' : el.value;
    const ot = $('O_' + f.key);
    if (ot && v[f.key] === f.other && ot.value.trim()) v._other[f.key] = ot.value.trim();
  });
  return v;
}
// 古い形（「T-25」「その他：xx」など）の値もコードに直す
function normC(f, x) {
  x = String(x == null ? '' : x).trim();
  if (x === '' || x === '該当なし') return { c: '' };
  if (f.opts.some(o => o[0] === x)) return { c: x };
  if (/^その他/.test(x)) return { c: f.other || x, o: x.replace(/^その他：?/, '') };
  if (f.key === 'slip_umu' && /^有/.test(x)) return { c: '1' };
  if (f.key === 'slip_umu' && x === '無') return { c: '0' };
  const head = x.split('：')[0];
  const hit = f.opts.find(o => o[0] === head || o[1] === x || o[1].split('：').slice(1).join('：') === x);
  return { c: hit ? hit[0] : x };
}
function svApply(v) {
  if (!v) return;
  SV.forEach(f => {
    const el = $('S_' + f.key); if (!el || v[f.key] == null) return;
    const z = normC(f, v[f.key]);
    if (z.c && ![...el.options].some(o => o.value === z.c)) el.add(new Option(codeName(f.key, z.c), z.c));
    el.value = z.c;
    const t = (v._other && v._other[f.key]) || z.o;
    if (t && $('O_' + f.key)) $('O_' + f.key).value = t;
  });
}
// 表示用：「コード：名称」＋その他の記述
function dispSv(f, v) {
  const el = $('S_' + f.key);
  if (el && el.disabled && f.naIfType) return '該当なし';
  const c = v[f.key]; if (!c) return '';
  return codeName(f.key, c) + (v._other && v._other[f.key] ? '（' + v._other[f.key] + '）' : '');
}
function missingReq() {
  if ($('pStatus').value === '') return [];           // 未調査のまま（内業で項目・位置だけ）は警告しない
  const v = svRead(), out = [];
  const w = $('pChosain').value;
  if (!w || w === '__new') out.push('調査者');
  SV.forEach(f => { const el = $('S_' + f.key); if (f.req && shown(f) && !v[f.key] && !(el && el.disabled)) out.push(f.name); });
  if ($('pStatus').value === '撮影完了' && !(shots.fukei && shots.futa)) out.push('写真2枚（蓋アップ・全景）');
  return out;
}
function bearing(lat1, lon1, lat2, lon2) {
  const R = 6378137, toR = Math.PI / 180;
  const dy = (lat2 - lat1) * toR * R, dx = (lon2 - lon1) * toR * R * Math.cos(lat1 * toR);
  const d = Math.sqrt(dx * dx + dy * dy);
  const dirs = ['北', '北東', '東', '南東', '南', '南西', '西', '北西'];
  const a = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
  return { d: d, dir: dirs[Math.round(a / 45) % 8] };
}
function isNewPt() { return !!cur && (cur[0] === 'NEW' || cur[5] === '新規'); }
function q(s) { return '「' + (s === '' || s == null || s === '—' ? '空欄' : s) + '」'; }
// 台帳（元の属性）と比べて、何を何に変えたかを文章にする
function autoText() {
  const v = svRead();
  if (isNewPt()) {
    const items = SV.filter(f => v[f.key]).map(f => f.name + '：' + dispSv(f, v));
    return { kubun: '新規登録', naiyo: items.join('／'), biko: '新規登録' + (items.length ? '（' + items.join('、') + '）' : '') };
  }
  // タイプ・口径は台帳のコードの意味が分からないため、変更内容には出さない（SURVEY の noDiff）
  // 台帳が空白の項目は「新たに入れた」だけなので、変更として出さない
  const ch = SV.filter(f => !f.noDiff && v[f.key] && String(origOf(cur, f.key) || '').trim() !== '' && v[f.key] !== origOf(cur, f.key));
  const mv = moveText();
  if (!ch.length && !mv) return { kubun: '修正なし', naiyo: '', biko: '変更なし' };
  const k = ch.map(f => f.name + '修正'), n = ch.map(f => f.name + '：' + codeName(f.key, origOf(cur, f.key)) + ' → ' + dispSv(f, v)),
        b = ch.map(f => f.name + 'を' + q(codeName(f.key, origOf(cur, f.key))) + 'から' + q(dispSv(f, v)) + 'に変更');
  if (mv) { k.push('位置移動'); n.push(mv.naiyo); b.push(mv.biko); }
  return { kubun: k.join('、'), naiyo: n.join('／'), biko: b.join('。') + '。' };
}
// ---------- 位置の移動 ----------
moveLine = null;
function fmtLL(lat, lon) { return Number(lat).toFixed(6) + ', ' + Number(lon).toFixed(6); }
function moveText() {
  if (!newPos || isNewPt()) return null;
  const b = bearing(cur[2], cur[3], newPos.lat, newPos.lon);

// 横長(4:3)・長辺 PHOTO_MAX px のJPEG。縦長の写真は中央を横長に切り出す
function toLandscape(file) {
  return new Promise((ok, ng) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      let sy = 0, sw = w, sh = h;
      if (h > w) { sh = Math.round(w * 3 / 4); sy = Math.round((h - sh) / 2); }
      const s = Math.min(1, PHOTO_MAX / sw);
      const c = document.createElement('canvas');
      c.width = Math.round(sw * s); c.height = Math.round(sh * s);
      c.getContext('2d').drawImage(img, 0, sy, sw, sh, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok({ data: c.toDataURL('image/jpeg', PHOTO_Q), cropped: h > w });
    };
    img.onerror = ng;
    img.src = url;
  });
}
function showShot(key, b64, isNew) {
  shots[key] = b64;
  shotNew[key] = !!isNew;
  const img = $(key === 'fukei' ? 'iFukei' : 'iFuta');
  if (b64 && b64 !== 'SAVED') {
    img.src = 'data:image/jpeg;base64,' + b64; img.style.display = 'block';
    if (key === 'futa') $('tFuta').src = img.src;

}

  msg('写真を準備中…');

    msg((key === 'fukei' ? '全景OK → 確認して「OK」' : '蓋アップOK → 次は全景') + (r.cropped ? '（縦向きだったので横長に切り出しました）' : ''), 1800);

}

    if (st === '一時保存' && p[4] !== '一時保存') return false;
    if (st === '済' && (p[4] === '' || p[4] === '一時保存')) return false;
    if (st === '新規' && p[5] !== '新規') return false;
    if (qv) { const b = String(banOf(p)).toUpperCase(); if (b.indexOf(qv) < 0 && p[0].indexOf(qv) < 0) return false; }
    return true;
  });
  const near = $('lsort').value === 'near' && myPos;
  if (near) arr.sort((a, b) => distM(a) - distM(b));
  else arr.sort((a, b) => String(banOf(a)).localeCompare(String(banOf(b))));
  $('lcount').textContent = arr.length + '件' + (arr.length > 300 ? '（先頭300件を表示）' : '') +
    ($('lsort').value === 'near' && !myPos ? '　※現在地を取得できないため人孔番号順' : '');
  $('litems').innerHTML = arr.slice(0, 300).map(p => {
    const d = distM(p);
    const col = (p[5] === '新規' && p[4] !== '一時保存') ? '#1565c0' : colorOf(p[4]);
    const ty = svOf(p, 'type') || origOf(p, 'type');
    return '<div class="li" data-ms="' + p[0] + '"><span class="dot" style="background:' + col + '"></span>' +
      '<div><div class="t1">' + esc(banOf(p) || '（人孔番号なし）') + '</div>' +
      '<div class="t2">リンクキー ' + p[0] + '　' + (p[4] || '未調査') + (ty ? '　' + esc(ty) : '') + '</div></div>' +
      (d != null ? '<div class="dist">' + (d < 1000 ? Math.round(d) + 'm' : (d / 1000).toFixed(1) + 'km') + '</div>' : '') + '</div>';
  }).join('');
}
$('litems').addEventListener('click', e => {
  const el = e.target.closest('.li'); if (!el) return;
  closeList(); jumpTo(el.getAttribute('data-ms'));
});

load();
</script>
</body>
</html>
